<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Modern E-Commerce Website" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ✅ Google Font for clean modern look -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ✅ TailwindCSS should be built into your project -->
    <title>MyShop | E-Commerce</title>

    <style>
      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #f9fafb, #eef2ff);
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #root {
        width: 100%;
      }

      /* Simple fade-in loader before React mounts */
      .loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: white;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      .loader {
        border: 4px solid #e2e8f0;
        border-top: 4px solid #6366f1;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .fade-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Loading animation -->
    <div id="loader" class="loading-screen">
      <div class="loader"></div>
      <p style="margin-top: 1rem; color: #4b5563;">Loading MyShop...</p>
    </div>

    <!-- React app mounts here -->
    <div id="root"></div>

    <script>
      // Remove loader when React app loads
      window.addEventListener("load", () => {
        const loader = document.getElementById("loader");
        loader.classList.add("fade-out");
        setTimeout(() => loader.remove(), 600);
      });
    </script>
  </body>
</html>
